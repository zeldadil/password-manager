name: QA sign-off audit

# ──────────────────────────────────────────────────────────────────────────────
# Fixture regression test of the QA sign-off gate's board audit — NOT the
# weekly audit itself (t_8a64c3dd).
#
# The weekly board audit runs LOCALLY, on the host that carries the board, as
# a Hermes cron job of the `qa` profile (`qa-weekly-signoff-audit`, Mondays
# 06:17 UTC): scripts/qa/cron/qa-weekly-signoff-audit.sh audits a throwaway
# worktree of origin/master with `signoff-gate.mjs audit --fail-on-a11` and
# `scripts/qa/signoff-audit-local.mjs` reports the result to the agents on the
# board (report attached to the maintenance card t_9c3f521a, one
# `AUDIT <date> : <rule>` comment per card in violation, an `AUDIT-RUN:` stamp
# for missed-run detection). See QA_SIGN_OFF_GATE.md §6.5.
#
# Why the `schedule` trigger and the real-board job were removed (t_8a64c3dd,
# Adil's decision 2026-10-09, architect analysis #632 on t_30d7dff5):
#   * a GitHub-hosted runner cannot see ~/.hermes/kanban.db, so a scheduled
#     board audit here can only report "AUDIT NOT RUN";
#   * the repository is PUBLIC: a self-hosted runner with the board mounted
#     would let a fork PR run code on the host (~/.hermes, agent credentials).
#     The `hermes-host` runner (CI-001h / t_527d4720 option 1) is abandoned;
#     the weekly schedule had produced a `cancelled` run every week since
#     2026-09-21. The repository variable QA_SIGNOFF_AUDIT_RUNNER is no longer
#     read.
#
# What remains here, on `ubuntu-latest`, with fixture boards only (never the
# real board), as a non-regression test:
#   * `bypass-report-fixture` (t_5b5b61e2) — the gate selftest, then the real
#     audit + summary steps against the selftest's synthetic bypass board;
#   * `local-audit-reporter-fixture` (t_8a64c3dd) — the selftest of the local
#     reporter: a fixture board, a stub `hermes` CLI, the real gate audit; it
#     proves a card in violation receives its `AUDIT` comment, the comments do
#     not change any card's gate result, and `check-stale` flags a missing run.
# Triggers: `pull_request` limited to the gate/reporter files, and
# `workflow_dispatch`. Not a required check on master: it never gates a merge.
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/qa/signoff-gate.mjs"
      - "scripts/qa/signoff-gate.selftest.mjs"
      - "scripts/qa/signoff-audit-summary.mjs"
      - "scripts/qa/signoff-audit-local.mjs"
      - "scripts/qa/signoff-audit-local.selftest.mjs"
      - "scripts/qa/cron/qa-weekly-signoff-audit.sh"
      - "scripts/qa/secret-guard.mjs"
      - ".github/workflows/qa-signoff-audit.yml"

permissions:
  contents: read

env:
  NODE_VERSION: "22"

concurrency:
  group: qa-signoff-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # t_5b5b61e2 — the bypass report, executed for real on the selftest's
  # synthetic bypass board (X1/X2/X3 cards, a secret-shaped reason, Markdown in
  # a reason). Expected: selftest green, audit exit 0 — the board carries
  # bypasses only, and a bypass never fails the audit — and a run summary
  # listing every occurrence. Zero npm dependencies, no install.
  # ────────────────────────────────────────────────────────────────────────────
  bypass-report-fixture:
    name: bypass-report-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Gate selftest (keeps its fixture root)
        id: selftest
        shell: bash
        run: |
          set -uo pipefail
          set +e
          node scripts/qa/signoff-gate.selftest.mjs --keep 2>&1 | tee "$RUNNER_TEMP/selftest.txt"
          code="${PIPESTATUS[0]}"
          set -e
          # First line: "QA sign-off gate selftest — fixture board: <root>/board.db"
          root="$(sed -n '1s#^.*fixture board: \(.*\)/board\.db$#\1#p' "$RUNNER_TEMP/selftest.txt")"
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Audit the synthetic bypass board
        shell: bash
        env:
          FIXTURE_ROOT: ${{ steps.selftest.outputs.root }}
        run: |
          set -uo pipefail
          test -f "$FIXTURE_ROOT/board-bypass.db" || { echo "::error::selftest fixture board-bypass.db not found under '$FIXTURE_ROOT'"; exit 1; }
          set +e
          QA_GATE_GITHUB_FIXTURE="$FIXTURE_ROOT/gh-empty.json" node scripts/qa/signoff-gate.mjs audit \
            --db "$FIXTURE_ROOT/board-bypass.db" --repo "$FIXTURE_ROOT/repo" --fail-on-a11 \
            --now-iso 2026-09-27T15:46:40Z --json-out "$RUNNER_TEMP/bypass-audit.json" 2>&1 | tee "$RUNNER_TEMP/bypass-audit.txt"
          code="${PIPESTATUS[0]}"
          set -e
          {
            echo "## Bypass report — synthetic fixture board (t_5b5b61e2)"
            echo
            echo "Fixture board from \`scripts/qa/signoff-gate.selftest.mjs\` section 10 — not the real board."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/qa/signoff-audit-summary.mjs --json "$RUNNER_TEMP/bypass-audit.json"
          {
            echo "### Audit report (exit code $code — expected 0: a bypass never fails the audit)"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/bypass-audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "0" ]; then
            echo "::error title=Bypass report::the audit of a board whose only findings are bypasses exited $code (expected 0)"
            exit 1
          fi

      - name: Upload the fixture bypass report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bypass-report-fixture
          path: |
            ${{ runner.temp }}/selftest.txt
            ${{ runner.temp }}/bypass-audit.txt
            ${{ runner.temp }}/bypass-audit.json
          if-no-files-found: warn
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # t_8a64c3dd — the local weekly audit's reporter, on a fixture board with a
  # stub `hermes` CLI (no ~/.hermes, no GitHub: QA_GATE_GITHUB=off). Covers the
  # negative control (a card in violation gets `AUDIT <date> : <rule>`), gate
  # inertness of those comments, idempotence, the `AUDIT-RUN:` stamp and
  # `check-stale`, and the failure paths. Also syntax-checks the cron wrapper.
  # ────────────────────────────────────────────────────────────────────────────
  local-audit-reporter-fixture:
    name: local-audit-reporter-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cron wrapper parses (bash -n)
        shell: bash
        run: bash -n scripts/qa/cron/qa-weekly-signoff-audit.sh

      - name: Reporter selftest
        shell: bash
        run: |
          set -uo pipefail
          sqlite3 --version
          set +e
          node scripts/qa/signoff-audit-local.selftest.mjs 2>&1 | tee "$RUNNER_TEMP/local-audit-selftest.txt"
          code="${PIPESTATUS[0]}"
          set -e
          {
            echo "## Local weekly audit reporter — fixture selftest (t_8a64c3dd)"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/local-audit-selftest.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Upload the reporter selftest output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-audit-reporter-fixture
          path: ${{ runner.temp }}/local-audit-selftest.txt
          if-no-files-found: warn
          retention-days: 14
