name: Secret scan (full history)

# ──────────────────────────────────────────────────────────────────────────────
# t_76461419 — weekly full-history gitleaks scan against the fingerprint
# baseline (.gitleaksignore, justified in docs/security/gitleaks-baseline.md).
#
# On `schedule` and `workflow_dispatch`, gitleaks-action scans EVERY ref
# (`git log -p -U0 --full-history --all`), not just the pushed range as the
# per-PR / push `secret-scan` job in ci.yml does. Any finding that is not one of
# the baselined fingerprints fails this run: a leak introduced on any branch, a
# rewritten branch or an old commit re-pushed shows up here within a week.
#
# Why its own workflow and not a `schedule:` trigger on ci.yml:
#   * a scheduled ci.yml would re-run all eight jobs every week for nothing;
#   * its `secret-scan` check would land on the master tip as a NON-push run of
#     a required context — exactly what the QA sign-off gate's R10 reports as
#     "non-push run disagrees with the push run" (t_339a0d02). This job has a
#     distinct name (`secret-scan-full-history`) and is NOT a required check, so
#     it can never touch the R10 verdict of a merge commit.
#
# The baseline is fingerprint-only (commit:file:rule:line). The format guard
# below refuses any file-wide / rule-wide / commit-less exclusion, so a new
# leak in a file that already has baselined findings is still reported.
# gitleaks is pinned: fingerprints were generated with 8.24.3 and a version
# bump must be checked against the baseline before it lands.
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Mondays 04:23 UTC (off the hour to avoid the scheduler's top-of-hour load).
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-full-history
  cancel-in-progress: false

jobs:
  secret-scan-full-history:
    name: secret-scan-full-history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every branch and tag: the scan covers all refs

      - name: baseline format guard (fingerprints only, no file/rule-wide exclusion)
        run: bash scripts/qa/check-gitleaksignore.sh .gitleaksignore

      - name: gitleaks full-history scan (all refs, baseline = .gitleaksignore)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"
