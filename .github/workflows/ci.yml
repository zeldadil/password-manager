name: CI

# QA-001b — fixed 8-job pipeline (TEST_STRATEGY.md §10). Each job is a required
# status check on `master` and blocks merge on failure:
#
#   install-lockfile → lint-typecheck → unit → integration → e2e
#                    → dependency-audit → secret-scan → build
#
# `install-lockfile` gates everything else: if the lockfile is out of sync, the
# seven verification jobs are skipped and the PR is blocked. The remaining jobs
# run in parallel after a green install so that every gate reports its own
# pass/fail verdict (a skipped job would hide a real result).
#
# QA-001d added the `sast` job (Semgrep) and the truffleHog step in
# `secret-scan`. Both security scans run INDEPENDENT of `install-lockfile`:
# they inspect source + git history and do not need installed dependencies, so
# a secret or source-level vulnerability must be flagged even when the lockfile
# is out of sync (a skipped security gate is a false sense of safety).
#
# QA-001g (this card) wired artifact upload into every job per TEST_STRATEGY
# §11 "Evidence Collection". Every job that produces a machine-readable report
# uploads it with `actions/upload-artifact@v4` under `if: always()` so the
# evidence is retained even when the gate FAILS (a failing test's report is the
# most important one). Retention mirrors §11:
#   - test reports + coverage + Playwright trace + web-ext lint ... 14 days
#   - gitleaks/truffleHog JSON + Semgrep SARIF + audit JSON ........ 90 days
# `if-no-files-found: warn` (not `error`) keeps the upload non-fatal during the
# monorepo bootstrap, when the reporters are wired but no suite has produced a
# report yet.
#
# Deferred to later QA cards (kept out of scope here):
#   - Unit coverage thresholds (Tier A 80/70/90) ............... QA-001e
#
# NOTE: the root `pnpm -r --parallel --filter '**' run <script>` delegation
# (inherited from ARC-001e) silently skips workspaces that do not define the
# script and returns exit 0 even when NO workspace runs it. That vacuous-pass
# is a bootstrap artefact: it becomes strict once every workspace ships its own
# `vitest run` (which fails on zero tests) and QA-001e adds coverage gates.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.12.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-lockfile:
    name: install-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

  lint-typecheck:
    name: lint-typecheck
    needs: [install-lockfile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: unit
    needs: [install-lockfile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test:unit
      # Tier A coverage thresholds (unit >=80%, critical paths >=90%) are
      # enforced in QA-001e once the fixtures/generator land.
      - name: Upload unit test report (JUnit XML + coverage)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-report
          path: |
            coverage/
            **/junit.xml
            test-results/*.xml
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: integration
    needs: [install-lockfile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Integration tests
        run: pnpm test:integration
      - name: Upload integration test report (JUnit XML + coverage)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report
          path: |
            coverage/
            **/junit.xml
            test-results/*.xml
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: e2e
    needs: [install-lockfile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers (Chromium, Firefox, WebKit)
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: E2E tests
        run: pnpm test:e2e
      - name: Upload Playwright HTML report + traces/screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: dependency-audit
    needs: [install-lockfile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (JSON report)
        run: |
          # Preserve the audit exit code (high/critical MUST fail the gate) while
          # still writing the machine-readable report. `set +e` keeps `bash -e`
          # from aborting before the report is flushed.
          set +e
          pnpm audit --prod --audit-level high --json > audit-report.json
          STATUS=$?
          set -e
          exit $STATUS
      - name: Upload dependency audit JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-report
          path: audit-report.json
          if-no-files-found: warn
          retention-days: 90

  secret-scan:
    name: secret-scan
    # QA-001d: removed `needs: [install-lockfile]` — secret scanning must run
    # even when dependencies are not installed (a secret leaked while the
    # lockfile is out of sync must still be caught).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so committed secrets are detected too
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: truffleHog secret scan (entropy + verified, JSON report)
        env:
          TRUFFLEHOG_VERSION: "3.97.5"
        run: |
          curl -sSfL -o trufflehog.tar.gz \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          tar -xzf trufflehog.tar.gz trufflehog
          # Capture the raw JSON to a temp file so the --fail exit code is
          # preserved, then REDACT the secret material (Raw/RawV2/SecretParts)
          # before anything leaves the runner. A scan report must never
          # re-publish the very secret it found (QA-001g; TEST_STRATEGY §7).
          # `set +e` is required: under the runner's `bash -e`, a truffleHog
          # finding (exit 183) would abort the step before redaction runs.
          set +e
          ./trufflehog git file://. --no-update --results=verified,unknown --json --fail > trufflehog-raw.json
          STATUS=$?
          set -e
          jq -c 'if type == "object" then
                   (if .Raw then .Raw = "REDACTED" else . end) |
                   (if .RawV2 then .RawV2 = "REDACTED" else . end) |
                   (if .SecretParts then (.SecretParts.key = "REDACTED" | .SecretParts.value = "REDACTED") else . end)
                 else . end' trufflehog-raw.json > trufflehog-report.json
          rm -f trufflehog-raw.json
          exit $STATUS
      - name: Upload secret-scan report (truffleHog JSON, redacted)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-report
          path: trufflehog-report.json
          if-no-files-found: warn
          retention-days: 90

  sast:
    name: sast
    # QA-001d: Semgrep SAST, independent of `install-lockfile` (scans source,
    # needs no node_modules). OWASP Top 10 + security-audit rulesets; SARIF is
    # uploaded to GitHub code scanning and retained as an artifact (QA-001g).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --sarif --output semgrep.sarif \
            .
      - name: Upload Semgrep SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
      - name: Upload Semgrep SARIF as build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 90

  build:
    name: build
    needs: [install-lockfile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build all workspaces
        run: pnpm build
      - name: Upload build + web-ext lint output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            apps/browser-firefox/web-ext-artifacts/
            **/web-ext-lint*.txt
          if-no-files-found: warn
          retention-days: 14
