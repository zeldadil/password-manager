  /permissions:
    get:
      tags: [Permissions]
      operationId: listPermissions
      summary: List permission grants
      description: |
        List permission grants accessible to authenticated user. Filtered by user's
        ownership and group membership. Authorization-checked.
      parameters:
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IncludeDeleted'
        - $ref: '#/components/parameters/IncludeRelations'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: Paginated list of permission grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSuccess'
        '403':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'

    post:
      tags: [Permissions]
      operationId: createPermission
      summary: Grant a permission
      description: |
        Grant permission to user or group on resource, folder, or vault.
        Authorization-checked — grantor must have Owner-level access to target
        (ADR-003 section 6.2). Group grants use group-as-ARO model (ADR-001 section 4).
        PASSBOLT-INSPIRED (ADR-001 section 4, section 5): permission grant concept,
          group-as-ARO.
        ORIGINAL: Permission.id as UUID primary key — each grant is a row
          (ADR-003 section 8.2 item 7). Numeric values preserved for continuity
          but stored as enum.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, granteeType, granteeId, level]
              properties:
                targetType:
                  type: string
                  enum: [resource, folder, vault]
                targetId:
                  type: string
                  format: uuid
                granteeType:
                  type: string
                  enum: [user, group]
                granteeId:
                  type: string
                  format: uuid
                level:
                  type: string
                  enum: [read, update, owner]
      responses:
        '201':
          description: Permission granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSuccess'
        '403':
          description: Not authorized to grant permission on this target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
        '404':
          description: Target not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'

  /permissions/{id}:
    delete:
      tags: [Permissions]
      operationId: revokePermission
      summary: Revoke a permission
      description: |
        Revoke permission grant. Authorization-checked — revoker must have Owner-level
        access to target, or be original grantor.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Permission revoked (soft-deleted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSuccess'
        '403':
          description: Not authorized to revoke this permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'
        '404':
          description: Permission not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeError'

